---
# l2leaf.node_groups[*].nodes will be injected from NetBox devices
l2leaf:
  defaults:
    platform: cEOSLab
    spanning_tree_mode: mstp
  node_groups:
    - group: DC1_L2_LEAF1
      uplink_switches: [dc1-leaf1a, dc1-leaf1b]
    - group: DC1_L2_LEAF2
      uplink_switches: [dc1-leaf2a, dc1-leaf2b]
