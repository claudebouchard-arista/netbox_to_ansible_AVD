---
- name: Create base output directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ avd_output_dir }}"
    - "{{ avd_output_dir }}/group_vars/FABRIC"
    - "{{ avd_output_dir }}/group_vars/{{ avd_network_services_name }}"
    - "{{ avd_output_dir }}/group_vars/{{ avd_connected_endpoints_name }}"

- name: Resolve group suffixes from config
  ansible.builtin.set_fact:
    _group_suffixes: >-
      {{ (avd_group_config if avd_group_config | length > 0
          else {'spine': {'suffix': 'SPINES'}, 'l3leaf': {'suffix': 'L3_LEAVES'},
                'l2leaf': {'suffix': 'L2_LEAVES'}, 'l2spine': {'suffix': 'SPINES'}})
         | dict2items | map(attribute='value') | map(attribute='suffix') | unique | list }}

- name: Create per-site output directories
  ansible.builtin.file:
    path: "{{ avd_output_dir }}/group_vars/{{ item.0 | upper | replace('-', '_') }}{{ item.1 }}"
    state: directory
    mode: "0755"
  loop: "{{ _avd_sites | product([''] + _group_suffixes | map('regex_replace', '^(.+)$', '_\\1') | list) | list }}"
  loop_control:
    label: "{{ item.0 | upper | replace('-', '_') }}{{ item.1 }}"

- name: Write inventory.yml
  ansible.builtin.copy:
    content: "---\n{{ _avd_inventory | to_nice_yaml(indent=2) }}"
    dest: "{{ avd_output_dir }}/inventory.yml"
    mode: "0644"

- name: Write fabric variables
  ansible.builtin.copy:
    content: "---\n{{ _avd_fabric_defaults | to_nice_yaml(indent=2) }}"
    dest: "{{ avd_output_dir }}/group_vars/FABRIC/fabric_variables.yml"
    mode: "0644"
  when: _avd_fabric_defaults | length > 0

- name: Write Ansible connectivity settings
  ansible.builtin.copy:
    content: "---\n{{ _avd_connectivity_defaults | to_nice_yaml(indent=2) }}"
    dest: "{{ avd_output_dir }}/group_vars/FABRIC/fabric_ansible_connectivity.yml"
    mode: "0644"
  when: _avd_connectivity_defaults | length > 0

- name: Write per-site DC settings
  ansible.builtin.copy:
    content: "---\n{{ _avd_dc_defaults | to_nice_yaml(indent=2) }}"
    dest: "{{ avd_output_dir }}/group_vars/{{ item | upper | replace('-', '_') }}/{{ item | replace('-', '_') }}.yml"
    mode: "0644"
  loop: "{{ _avd_sites }}"
  when: _avd_dc_defaults | length > 0

- name: Resolve spine group suffix
  ansible.builtin.set_fact:
    _spine_suffix: >-
      {{ (avd_group_config if avd_group_config | length > 0
          else {'spine': {'suffix': 'SPINES'}, 'l2spine': {'suffix': 'SPINES'}})
         | dict2items | selectattr('key', 'in', ['spine', 'l2spine', 'l3spine'])
         | map(attribute='value') | map(attribute='suffix') | first | default('SPINES') }}
    _l3leaf_suffix: >-
      {{ (avd_group_config if avd_group_config | length > 0
          else {'l3leaf': {'suffix': 'L3_LEAVES'}})
         | dict2items | selectattr('key', 'equalto', 'l3leaf')
         | map(attribute='value') | map(attribute='suffix') | first | default('L3_LEAVES') }}
    _l2leaf_suffix: >-
      {{ (avd_group_config if avd_group_config | length > 0
          else {'l2leaf': {'suffix': 'L2_LEAVES'}})
         | dict2items | selectattr('key', 'equalto', 'l2leaf')
         | map(attribute='value') | map(attribute='suffix') | first | default('L2_LEAVES') }}

- name: Write per-site spine group_vars
  ansible.builtin.copy:
    content: "---\n{{ lookup('vars', '_avd_site_spines_' + item | replace('-', '_')) | arista.netbox_avd.to_avd_fix_types | to_nice_yaml(indent=2) }}"
    dest: "{{ avd_output_dir }}/group_vars/{{ item | upper | replace('-', '_') }}_{{ _spine_suffix }}/spines.yml"
    mode: "0644"
  loop: "{{ _avd_sites }}"

- name: Write per-site L3 leaf group_vars
  ansible.builtin.copy:
    content: "---\n{{ lookup('vars', '_avd_site_l3leaves_' + item | replace('-', '_')) | arista.netbox_avd.to_avd_fix_types | to_nice_yaml(indent=2) }}"
    dest: "{{ avd_output_dir }}/group_vars/{{ item | upper | replace('-', '_') }}_{{ _l3leaf_suffix }}/l3_leaves.yml"
    mode: "0644"
  loop: "{{ _avd_sites }}"
  when: lookup('vars', '_avd_site_l3leaves_' + item | replace('-', '_'), default='') | length > 0

- name: Write per-site L2 leaf group_vars
  ansible.builtin.copy:
    content: "---\n{{ lookup('vars', '_avd_site_l2leaves_' + item | replace('-', '_')) | arista.netbox_avd.to_avd_fix_types | to_nice_yaml(indent=2) }}"
    dest: "{{ avd_output_dir }}/group_vars/{{ item | upper | replace('-', '_') }}_{{ _l2leaf_suffix }}/l2_leaves.yml"
    mode: "0644"
  loop: "{{ _avd_sites }}"
  when: lookup('vars', '_avd_site_l2leaves_' + item | replace('-', '_'), default='') | length > 0

- name: Write network services
  ansible.builtin.copy:
    content: "---\n{{ _avd_network_services | arista.netbox_avd.to_avd_fix_types | to_nice_yaml(indent=2) }}"
    dest: "{{ avd_output_dir }}/group_vars/{{ avd_network_services_name }}/network_services.yml"
    mode: "0644"
  when: _avd_network_services | length > 0

- name: Write connected endpoints
  ansible.builtin.copy:
    content: "---\n{{ _avd_connected_endpoints | arista.netbox_avd.to_avd_fix_types | to_nice_yaml(indent=2) }}"
    dest: "{{ avd_output_dir }}/group_vars/{{ avd_connected_endpoints_name }}/connected_endpoints.yml"
    mode: "0644"
  when: _avd_connected_endpoints | length > 0

- name: Write build.yml playbook
  ansible.builtin.copy:
    content: |
      ---
      - name: Build Configurations and Documentation
        hosts: FABRIC
        gather_facts: false
        tasks:

          - name: Generate AVD Structured Configurations and Fabric Documentation
            ansible.builtin.import_role:
              name: arista.avd.eos_designs

          - name: Generate Device Configurations and Documentation
            ansible.builtin.import_role:
              name: arista.avd.eos_cli_config_gen
    dest: "{{ avd_output_dir }}/build.yml"
    mode: "0644"
  when: avd_generate_playbooks | bool

- name: Write deploy.yml playbook
  ansible.builtin.copy:
    content: |
      ---
      - name: Deploy Configurations to Devices using eAPI
        hosts: FABRIC
        gather_facts: false
        tasks:

          - name: Deploy Configurations to Devices
            ansible.builtin.import_role:
              name: arista.avd.eos_config_deploy_eapi
    dest: "{{ avd_output_dir }}/deploy.yml"
    mode: "0644"
  when: avd_generate_playbooks | bool

- name: Display output location
  ansible.builtin.debug:
    msg: "AVD inventory written to {{ avd_output_dir }}/ ({{ _avd_sites | length }} site(s))"
