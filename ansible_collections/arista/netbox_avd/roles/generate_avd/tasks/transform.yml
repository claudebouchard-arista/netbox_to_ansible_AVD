---
# --- Build inventory (single or multi-site) ---
- name: Resolve group config
  ansible.builtin.set_fact:
    _avd_group_config: "{{ avd_group_config if avd_group_config | length > 0 else omit }}"

- name: Build single-site inventory
  ansible.builtin.set_fact:
    _avd_inventory: >-
      {{ _netbox_devices
         | arista.netbox_avd.to_avd_inventory(
             _avd_sites[0], avd_role_mapping,
             _netbox_ip_addresses, avd_mgmt_interface_name,
             _avd_group_config | default(none, true),
             avd_network_services_name,
             avd_connected_endpoints_name) }}
  when: not _avd_multi_site | bool

- name: Build multi-site inventory
  ansible.builtin.set_fact:
    _avd_inventory: >-
      {{ _netbox_devices_by_site
         | arista.netbox_avd.to_avd_multi_site_inventory(
             avd_role_mapping,
             _netbox_ip_addresses, avd_mgmt_interface_name,
             _avd_group_config | default(none, true)) }}
  when: _avd_multi_site | bool

# --- Per-site transforms ---
- name: Transform per-site data
  ansible.builtin.include_tasks: transform_site.yml
  loop: "{{ _avd_sites }}"
  loop_control:
    loop_var: _current_site

# --- Shared transforms (network services, connected endpoints) ---
- name: Build network services from NetBox VLANs/VRFs
  ansible.builtin.set_fact:
    _avd_network_services: >-
      {{ _netbox_vlans
         | arista.netbox_avd.to_avd_network_services(
             _netbox_vrfs, _netbox_prefixes, _netbox_tenants,
             _avd_network_services_defaults) }}

- name: Build connected endpoints from NetBox cables
  ansible.builtin.set_fact:
    _avd_connected_endpoints: >-
      {{ _netbox_cables
         | arista.netbox_avd.to_avd_connected_endpoints(
             _netbox_interfaces, _netbox_devices, avd_role_mapping) }}

- name: Display transform summary
  ansible.builtin.debug:
    msg: >-
      Transformed {{ _avd_sites | length }} site(s):
      {{ _netbox_devices | length }} devices,
      {{ _netbox_vlans | length }} VLANs,
      {{ _netbox_vrfs | length }} VRFs,
      {{ _netbox_cables | length }} cables
