---
# NetBox connection settings
netbox_url: "{{ lookup('env', 'NETBOX_URL') | default('http://localhost:18080', true) }}"
netbox_token: "{{ lookup('env', 'NETBOX_TOKEN') | default('0123456789abcdef0123456789abcdef01234567', true) }}"
netbox_validate_certs: false

# NetBox query filters - use netbox_site for single-DC, netbox_sites for multi-DC
netbox_site: ""
netbox_sites: []
netbox_device_status: active

# Output and defaults directories
avd_defaults_dir: "{{ playbook_dir }}/avd_defaults"
avd_output_dir: "{{ playbook_dir }}/avd_inventory"

# NetBox device role slug -> AVD node type mapping
avd_role_mapping:
  spine: spine
  l3-leaf: l3leaf
  l2-leaf: l2leaf

# NetBox custom field names
avd_node_id_field: avd_node_id
avd_node_group_field: avd_node_group

# Management interface name for IP lookup
avd_mgmt_interface_name: Management0

# Generate AVD playbooks alongside inventory
avd_generate_playbooks: true

# Group naming config (override for L2LS or other topologies)
# Keys are AVD types, values have: suffix, in_network_services, in_connected_endpoints
avd_group_config: {}

# Override network services / connected endpoints group names
avd_network_services_name: NETWORK_SERVICES
avd_connected_endpoints_name: CONNECTED_ENDPOINTS
