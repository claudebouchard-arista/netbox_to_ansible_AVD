---
fabric_name: FABRIC

underlay_routing_protocol: ebgp
overlay_routing_protocol: ebgp

aaa_settings:
  local_users:
    - name: admin
      privilege: 15
      role: network-admin
      no_password: true
    - name: arista
      privilege: 15
      role: network-admin
      sha512_password: "$6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1."

bgp_peer_groups:
  evpn_overlay_peers:
    password: Q4fqtbqcZ7oQuKfuWtNGRQ==
  ipv4_underlay_peers:
    password: 7x4B4rnJhZB438m9+BrBfQ==
  mlag_ipv4_underlay_peer:
    password: 4b21pAdCvWeAqpcKDFMdWw==

default_interfaces:
  - types: [spine]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]
    downlink_interfaces: [Ethernet1-8]
  - types: [l3leaf]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]
    mlag_interfaces: [Ethernet3-4]
    downlink_interfaces: [Ethernet8]
  - types: [l2leaf]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]

dns_settings:
  servers:
    - ip_address: 192.168.1.1

ntp_settings:
  server_vrf: use_mgmt_interface_vrf
  servers:
    - name: 0.pool.ntp.org

# DCI links between border leafs across DCs
l3_edge:
  p2p_links:
    - nodes: [dc1-leaf2a, dc2-leaf2a]
      interfaces: [Ethernet6, Ethernet6]
      as: [65102, 65202]
      subnet: 172.16.255.0/31
      include_in_underlay_protocol: true
    - nodes: [dc1-leaf2b, dc2-leaf2b]
      interfaces: [Ethernet6, Ethernet6]
      as: [65102, 65202]
      subnet: 172.16.255.2/31
      include_in_underlay_protocol: true
