---
l2leaf:
  defaults:
    platform: cEOSLab
    spanning_tree_mode: mstp
  node_groups:
    - group: DC1_L2_LEAF1
      uplink_switches: [dc1-leaf1a, dc1-leaf1b]
    - group: DC1_L2_LEAF2
      uplink_switches: [dc1-leaf2a, dc1-leaf2b]
    - group: DC2_L2_LEAF1
      uplink_switches: [dc2-leaf1a, dc2-leaf1b]
    - group: DC2_L2_LEAF2
      uplink_switches: [dc2-leaf2a, dc2-leaf2b]
