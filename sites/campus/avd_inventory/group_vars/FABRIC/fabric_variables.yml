---
ansible_become: true
ansible_become_method: enable
ansible_connection: ansible.netcommon.httpapi
ansible_httpapi_use_ssl: true
ansible_httpapi_validate_certs: false
ansible_network_os: arista.eos.eos
ansible_password: arista
ansible_user: arista
core_interfaces:
  p2p_links:
  - include_in_underlay_protocol: true
    interfaces:
    - Ethernet52/1
    - Ethernet1/1
    ip:
    - 10.0.0.3/31
    - 10.0.0.2/31
    nodes:
    - campus-spine1
    - WAN
  - include_in_underlay_protocol: true
    interfaces:
    - Ethernet52/1
    - Ethernet1/1
    ip:
    - 10.0.0.5/31
    - 10.0.0.4/31
    nodes:
    - campus-spine2
    - WAN
fabric_name: CAMPUS1
management_eapi:
  enabled: true
underlay_routing_protocol: ospf
