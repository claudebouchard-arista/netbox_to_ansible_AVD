!
no enable password
no aaa root
!
username admin privilege 15 role network-admin nopassword
username arista privilege 15 role network-admin secret sha512 $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname campus-leaf2a
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 8.8.4.4
ip name-server vrf MGMT 8.8.8.8
!
spanning-tree mode mstp
spanning-tree mst 0 priority 16384
!
vlan 10
   name INBAND_MGMT
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel1
   description L2_SPINES_Port-Channel491
   no shutdown
   switchport trunk allowed vlan 10
   switchport mode trunk
   switchport
!
interface Ethernet1
   description L2_campus-spine1_Ethernet49/1
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_campus-spine2_Ethernet49/1
   no shutdown
   channel-group 1 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.16.100.205/24
!
interface Vlan10
   description Inband Management
   no shutdown
   mtu 1500
   ip address 10.10.10.8/24
no ip routing vrf MGMT
!
ip route 0.0.0.0/0 10.10.10.1
ip route vrf MGMT 0.0.0.0/0 172.16.100.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT pool.ntp.org
ntp server vrf MGMT time.google.com prefer
!
end
