aaa_authorization:
  exec:
    default: local
aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet53
  description: MLAG_campus-leaf1b_Ethernet53
  shutdown: false
  channel_group:
    id: 53
    mode: active
  metadata:
    peer: campus-leaf1b
    peer_interface: Ethernet53
    peer_type: mlag_peer
- name: Ethernet54
  description: MLAG_campus-leaf1b_Ethernet54
  shutdown: false
  channel_group:
    id: 53
    mode: active
  metadata:
    peer: campus-leaf1b
    peer_interface: Ethernet54
    peer_type: mlag_peer
- name: Ethernet51
  description: L2_campus-spine1_Ethernet1
  shutdown: false
  channel_group:
    id: 51
    mode: active
  metadata:
    peer: campus-spine1
    peer_interface: Ethernet1
    peer_type: l3spine
hostname: campus-leaf1a
ip_domain_lookup:
  source_interfaces:
  - name: Management1
    vrf: MGMT
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 8.8.4.4
    - ip_address: 8.8.8.8
local_users:
- name: admin
  privilege: 15
  role: network-admin
  no_password: true
- name: arista
  privilege: 15
  role: network-admin
  sha512_password: $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.100.203/24
  type: oob
  gateway: 172.16.100.1
metadata:
  is_deployed: true
  platform: cEOSLab
  fabric_name: CAMPUS1
  validate_hardware:
    enabled: false
mlag_configuration:
  domain_id: IDF1
  local_interface: Vlan4094
  peer_address: 192.168.0.5
  peer_link: Port-Channel53
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: time.google.com
    preferred: true
  - name: pool.ntp.org
  vrf: MGMT
port_channel_interfaces:
- name: Port-Channel53
  description: MLAG_campus-leaf1b_Port-Channel53
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel51
  description: L2_SPINES_Port-Channel1
  shutdown: false
  mlag: 51
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: '10'
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 16384
  no_spanning_tree_vlan: '4094'
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 172.16.100.1
- prefix: 0.0.0.0/0
  next_hop: 10.10.10.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 192.168.0.4/31
  mtu: 9214
  no_autostate: true
- name: Vlan10
  description: Inband Management
  shutdown: false
  ip_address: 10.10.10.6/24
  mtu: 1500
  metadata:
    type: inband_mgmt
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 10
  name: INBAND_MGMT
  metadata:
    tenants:
    - system
vrfs:
- name: MGMT
  ip_routing: false
