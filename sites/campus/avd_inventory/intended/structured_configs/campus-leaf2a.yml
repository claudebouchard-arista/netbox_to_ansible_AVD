aaa_authorization:
  exec:
    default: local
aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: L2_campus-spine1_Ethernet49/1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: campus-spine1
    peer_interface: Ethernet49/1
    peer_type: l3spine
- name: Ethernet2
  description: L2_campus-spine2_Ethernet49/1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: campus-spine2
    peer_interface: Ethernet49/1
    peer_type: l3spine
hostname: campus-leaf2a
ip_domain_lookup:
  source_interfaces:
  - name: Management1
    vrf: MGMT
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 8.8.4.4
    - ip_address: 8.8.8.8
local_users:
- name: admin
  privilege: 15
  role: network-admin
  no_password: true
- name: arista
  privilege: 15
  role: network-admin
  sha512_password: $6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1.
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.100.205/24
  type: oob
  gateway: 172.16.100.1
metadata:
  is_deployed: true
  platform: cEOSLab
  fabric_name: CAMPUS1
  validate_hardware:
    enabled: false
ntp:
