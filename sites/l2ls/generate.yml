---
- name: Generate AVD Inventory from NetBox for L2LS Fabric
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    netbox_url: "{{ lookup('env', 'NETBOX_URL') }}"
    netbox_token: "{{ lookup('env', 'NETBOX_TOKEN') | default('0123456789abcdef0123456789abcdef01234567', true) }}"
    netbox_site: l2ls-site1
    avd_defaults_dir: "{{ playbook_dir }}/avd_defaults"
    avd_output_dir: "{{ playbook_dir }}/avd_inventory"
    # L2LS uses l2spine + l2leaf instead of spine + l3leaf
    avd_role_mapping:
      l2-spine: l2spine
      l2-leaf: l2leaf
    # L2LS group naming: SPINES and LEAFS (not L3_LEAVES/L2_LEAVES)
    avd_group_config:
      l2spine:
        suffix: SPINES
        in_network_services: true
        in_connected_endpoints: true
      l2leaf:
        suffix: LEAFS
        in_network_services: true
        in_connected_endpoints: true
    # L2LS uses site-scoped network services and endpoints names
    avd_network_services_name: "{{ netbox_site | upper | replace('-', '_') }}_NETWORK_SERVICES"
    avd_connected_endpoints_name: "{{ netbox_site | upper | replace('-', '_') }}_ENDPOINTS"
  roles:
    - arista.netbox_avd.generate_avd
