---
# L2LS fabric - the fabric_name must match the top-level inventory group
fabric_name: L2LS_SITE1

eos_designs_documentation:
  connected_endpoints: true

dns_settings:
  servers:
    - ip_address: 8.8.4.4
    - ip_address: 8.8.8.8

ntp_settings:
  server_vrf: use_mgmt_interface_vrf
  servers:
    - name: time.google.com
    - name: pool.ntp.org

aaa_settings:
  local_users:
    - name: admin
      privilege: 15
      role: network-admin
      no_password: true
    - name: arista
      privilege: 15
      role: network-admin
      sha512_password: "$6$Enl0WfE32FthwyiJ$yTyGaEJ2uPKLU.F7314YtB7J1jrzrMi7ogXIRTEHQfLdLgKWWmr1UvNlZLN6AyuxET7G5aH3AI9OYRzxVTkB1."
  authorization:
    exec:
      default: local
  authentication:
    policies:
      local:
        allow_nopassword: true

default_interfaces:
  - types: [l2spine]
    platforms: [default]
    downlink_interfaces: [Ethernet1-8]
    mlag_interfaces: [Ethernet47-48]
  - types: [l2leaf]
    platforms: [default]
    uplink_interfaces: [Ethernet1-2]
    mlag_interfaces: [Ethernet47-48]
