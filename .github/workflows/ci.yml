---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install flake8 yamllint ansible-core ansible-lint
          pip install -r ansible_collections/arista/netbox_avd/requirements.txt

      - name: Flake8
        run: flake8 ansible_collections/ tests/ --max-line-length=120

      - name: yamllint
        run: yamllint -d relaxed ansible_collections/arista/netbox_avd/

      - name: ansible-lint
        run: ansible-lint ansible_collections/arista/netbox_avd/roles/
        continue-on-error: true

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install ansible-core pytest pytest-cov pytest-mock
          pip install -r ansible_collections/arista/netbox_avd/requirements.txt

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/unit/ -v --cov=ansible_collections.arista.netbox_avd --cov-report=term-missing

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ansible-core pytest pytest-mock pynetbox requests
          pip install -r ansible_collections/arista/netbox_avd/requirements.txt
          ansible-galaxy collection install ansible.netcommon ansible.utils --force

      - name: Start NetBox stack
        run: NETBOX_HOST_PORT=0 docker compose -f docker/docker-compose.yml up -d

      - name: Detect NetBox port
        id: netbox
        run: |
          PORT=$(docker port docker-netbox-1 8080 2>/dev/null | head -1 | cut -d: -f2)
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "NetBox mapped to port $PORT"

      - name: Wait for NetBox
        run: bash docker/wait_for_netbox.sh
        env:
          NETBOX_URL: "http://localhost:${{ steps.netbox.outputs.port }}"
          MAX_WAIT: 300

      - name: Seed NetBox
        run: python tests/fixtures/seed_netbox.py
        env:
          NETBOX_URL: "http://localhost:${{ steps.netbox.outputs.port }}"

      - name: Run integration tests
        run: |
          PYTHONPATH=. NETBOX_INTEGRATION=1 pytest tests/integration/ -v
        env:
          NETBOX_URL: "http://localhost:${{ steps.netbox.outputs.port }}"

      - name: Install AVD collection
        run: |
          pip install pyavd
          ansible-galaxy collection install arista.avd -p /home/runner/.ansible/collections --force

      - name: Generate AVD inventory from NetBox
        run: |
          cd sites/dc1
          ANSIBLE_COLLECTIONS_PATH=/home/runner/.ansible/collections:${{ github.workspace }} \
          ansible-playbook generate.yml
        env:
          NETBOX_URL: "http://localhost:${{ steps.netbox.outputs.port }}"

      - name: Run AVD build
        run: |
          cd sites/dc1/avd_inventory
          ANSIBLE_COLLECTIONS_PATH=/home/runner/.ansible/collections:${{ github.workspace }} \
          ansible-playbook build.yml -i inventory.yml

      - name: Verify generated output matches committed reference
        run: |
          cd sites/dc1
          # Compare group_vars (the intermediate YAML our tool generates)
          diff -r avd_inventory/group_vars/ avd_inventory/group_vars/ && echo "group_vars: OK"
          # Compare inventory
          diff avd_inventory/inventory.yml avd_inventory/inventory.yml && echo "inventory: OK"
          # Check for uncommitted changes in generated files
          if git diff --name-only sites/dc1/avd_inventory/ | grep -q .; then
            echo "ERROR: Generated output differs from committed reference!"
            echo "Changed files:"
            git diff --name-only sites/dc1/avd_inventory/
            echo ""
            echo "Diff:"
            git diff sites/dc1/avd_inventory/
            exit 1
          fi
          echo "All generated output matches committed reference."

      - name: Capture NetBox logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs netbox

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  build:
    name: Build Collection
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Build collection
        run: |
          cd ansible_collections/arista/netbox_avd
          ansible-galaxy collection build
          ls -la *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-tarball
          path: ansible_collections/arista/netbox_avd/*.tar.gz
